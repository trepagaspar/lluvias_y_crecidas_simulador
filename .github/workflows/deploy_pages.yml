name: Desplegar Visor 3D en GitHub Pages (liviano)

on:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "visor_3d_santa_fe.html"
      - "datos_en_vivo.json"
      - "config/**"
      - "src/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Preparar paquete web liviano (< 5 MB, excluyendo datos crudos y docs)
        run: |
          mkdir -p _site/config
          cp index.html visor_3d_santa_fe.html .nojekyll datos_en_vivo.json _site/
          cp config/*.json _site/config/
          cp -r src assets _site/
          du -sh _site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
