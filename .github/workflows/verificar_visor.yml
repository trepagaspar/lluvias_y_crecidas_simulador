name: Verificar visor 3D, assets y tests

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python y Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar sintaxis Python de scripts
        run: |
          python -m py_compile scripts/*.py tests/test_project.py

      - name: Ejecutar suite de pruebas unitarias, seguridad, sincronía y sintaxis JS
        run: |
          python -m unittest discover -s tests -v
