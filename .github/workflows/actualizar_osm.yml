name: Actualizar capas OpenStreetMap

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: actualizar-osm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar_osm:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar canales y defensas desde OSM
        run: python scripts/descargar_osm.py

      - name: Sincronizar assets/*.json del visor desde los GeoJSON actualizados
        run: python scripts/sync_assets_json.py

      - name: Validar integridad de GeoJSON, cotas FABDEM y assets sincronizados
        run: python -m unittest discover -s tests -v

      - name: Publicar cambios en rama bot/osm-update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet datos/vectores/ assets/; then
            git checkout -B bot/osm-update
            git add datos/vectores/osm_canales_defensas.geojson assets/osm_lines.json assets/city_pumps.json
            git commit -m "chore(osm): actualizar capas OSM y sincronizar assets JSON"
            git push -u origin bot/osm-update --force-with-lease
          else
            echo "Sin cambios en capas OSM"
          fi
